<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Review Queue</title>
    <style>
        /* Permanent Dark Mode (Slate Theme) */
        :root {
            --bg-color: #0f172a;
            /* Slate 900 */
            --surface-color: #1e293b;
            /* Slate 800 */
            --border-color: #334155;
            /* Slate 700 */
            --input-bg: #334155;
            /* Slate 700 */
            --text-main: #f1f5f9;
            /* Slate 100 */
            --text-muted: #94a3b8;
            /* Slate 400 */

            --primary-color: #798290;
            /* Steel (Save) */
            --success-color: #B0BA93;
            /* Sage (Add) */
            --danger-color: #BA9093;
            /* Rose (Delete) */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: var(--text-main);
            margin-bottom: 30px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Cards */
        .memory-card {
            background: var(--surface-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

        .memory-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            border-color: #475569;
        }

        /* Forms */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.9em;
        }

        textarea,
        select,
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        textarea:focus,
        select:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Suggested Tags Section */
        .suggested-tags-container {
            background: var(--surface-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        .section-icon {
            width: 18px;
            height: 18px;
            margin-right: 8px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tags-pill-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag-pill {
            background: var(--input-bg);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            transition: all 0.2s;
        }

        .tag-pill:hover {
            border-color: var(--text-muted);
            background: #3d4b5f;
        }

        .tag-pill .tag-count {
            background: var(--bg-color);
            color: var(--text-muted);
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 8px;
            font-weight: bold;
        }

        .tag-pill .dismiss-tag {
            margin-left: 8px;
            cursor: pointer;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 1.1rem;
            line-height: 1;
            transition: color 0.2s;
        }

        .tag-pill .dismiss-tag:hover {
            color: var(--danger-color);
        }

        /* Tags */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            padding: 8px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            min-height: 46px;
            align-items: center;
        }

        .tag {
            background-color: #2E4648;
            /* Steel tint */
            color: #f1f5f9;
            /* Slate 100 */
            border: 1px solid #798290;
            /* Steel */
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            display: flex;
            align-items: center;
        }

        .tag .remove-tag {
            margin-left: 6px;
            cursor: pointer;
            color: #94a3b8;
            /* Slate 400 */
            font-weight: bold;
        }

        .tag .remove-tag:hover {
            color: #BA9093;
            /* Rose */
        }

        /* Buttons */
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            color: #0f172a;
            /* Dark text for pastel buttons */
        }

        .btn-save {
            background-color: var(--primary-color);
            color: #f1f5f9;
            /* White text for Steel */
        }

        .btn-save:hover {
            background-color: #64748b;
            /* Lighter Steel */
        }

        .btn-commit {
            background-color: var(--success-color);
        }

        .btn-commit:hover {
            background-color: #9ca67b;
            /* Darker Sage */
        }

        .btn-delete {
            background-color: var(--danger-color);
        }

        .btn-delete:hover {
            background-color: #a37d80;
            /* Darker Rose */
        }

        /* Autocomplete */
        .autocomplete-items {
            position: absolute;
            border: 1px solid var(--border-color);
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--surface-color);
            max-height: 150px;
            overflow-y: auto;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .autocomplete-items div:last-child {
            border-bottom: none;
        }

        .autocomplete-items div:hover {
            background-color: var(--border-color);
        }

        .tag-input-wrapper {
            position: relative;
        }

        /* Status & Dashboard */
        .loading,
        .empty-queue {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-style: italic;
        }

        .dashboard-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--surface-color);
            padding: 15px 25px;
            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        .status-group {
            display: flex;
            gap: 20px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 50px;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .status-pill:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: #475569;
        }

        .pill-icon {
            width: 20px;
            height: 20px;
            color: var(--text-muted);
        }

        .pill-content {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .pill-label {
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            /* Slate 500 */
            font-weight: 700;
        }

        .pill-value {
            font-size: 0.9em;
            font-weight: 600;
            color: var(--text-main);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 5px;
            box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.5);
            /* Shadow matches bg */
        }

        .status-dot.active {
            background-color: var(--success-color);
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
        }

        .status-dot.error {
            background-color: var(--danger-color);
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
        }

        .status-dot.connecting {
            background-color: #eab308;
            box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.2);
        }

        /* Refresh Button */
        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            color: var(--text-muted);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--primary-color);
        }

        .btn-icon svg {
            width: 20px;
            height: 20px;
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- New Dashboard Status Bar -->
        <div id="status-bar" class="dashboard-bar">
            <div class="status-group">
                <!-- Vector DB Pill -->
                <div class="status-pill" id="vector-status">
                    <!-- Database Icon -->
                    <svg class="pill-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
                    </svg>
                    <div class="pill-content">
                        <span class="pill-label">Vector DB</span>
                        <span class="pill-value">Checking...</span>
                    </div>
                    <span class="status-dot connecting"></span>
                </div>

                <!-- Graph DB Pill -->
                <div class="status-pill" id="graph-status">
                    <!-- Share/Network Icon -->
                    <svg class="pill-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                    </svg>
                    <div class="pill-content">
                        <span class="pill-label">Graph DB</span>
                        <span class="pill-value">Checking...</span>
                    </div>
                    <span class="status-dot connecting"></span>
                </div>

                <!-- SQL DB Pill -->
                <div class="status-pill" id="sql-status">
                    <!-- Table Icon -->
                    <svg class="pill-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    <div class="pill-content">
                        <span class="pill-label">SQL DB</span>
                        <span class="pill-value">Checking...</span>
                    </div>
                    <span class="status-dot connecting"></span>
                </div>
            </div>

            <!-- Refresh Button -->
            <button id="refresh-status-btn" class="btn-icon" title="Refresh Status">
                <svg class="refresh-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>

        <!-- Suggested Tags Section (Hidden by default) -->
        <div id="suggested-tags-section" class="suggested-tags-container" style="display: none;">
            <div class="section-header">
                <svg class="section-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                </svg>
                <span class="section-title">Trending Suggested Tags</span>
            </div>
            <div id="suggested-tags-list" class="tags-pill-list"></div>
        </div>

        <h1>Memory Review Queue</h1>
        <div id="queue-container">
            <div class="loading">Loading queue...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
