<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Review Queue</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .memory-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            padding: 20px;
            transition: transform 0.2s;
        }

        .memory-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        textarea,
        select,
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            min-height: 40px;
            align-items: center;
        }

        .tag {
            background-color: #e0e7ff;
            color: #3730a3;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
        }

        .tag .remove-tag {
            margin-left: 5px;
            cursor: pointer;
            color: #3730a3;
            font-weight: bold;
        }

        .tag .remove-tag:hover {
            color: #1e1b4b;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn-save {
            background-color: #3498db;
            color: white;
        }

        .btn-save:hover {
            background-color: #2980b9;
        }

        .btn-commit {
            background-color: #2ecc71;
            color: white;
        }

        .btn-commit:hover {
            background-color: #27ae60;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }

        .autocomplete-items {
            position: absolute;
            border: 1px solid #d4d4d4;
            border-bottom: none;
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #fff;
            max-height: 150px;
            overflow-y: auto;
        }

        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
            background-color: #fff;
            border-bottom: 1px solid #d4d4d4;
        }

        .autocomplete-items div:hover {
            background-color: #e9e9e9;
        }

        .tag-input-wrapper {
            position: relative;
        }

        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #777;
        }

        .empty-queue {
            text-align: center;
            padding: 40px;
            color: #777;
            font-size: 1.2em;
        }

        /* Dashboard & Status Bar Styles */
        .dashboard-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            padding: 15px 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #f1f5f9;
        }

        .status-group {
            display: flex;
            gap: 20px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background-color: #f8fafc;
            border-radius: 50px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }

        .status-pill:hover {
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .pill-icon {
            width: 20px;
            height: 20px;
            color: #64748b;
        }

        .pill-content {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .pill-label {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            font-weight: 700;
        }

        .pill-value {
            font-size: 0.9em;
            font-weight: 600;
            color: #334155;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 5px;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5);
        }

        .status-dot.active {
            background-color: #22c55e;
            box-shadow: 0 0 0 2px #dcfce7;
        }

        .status-dot.error {
            background-color: #ef4444;
            box-shadow: 0 0 0 2px #fee2e2;
        }

        .status-dot.connecting {
            background-color: #eab308;
            box-shadow: 0 0 0 2px #fef9c3;
        }

        /* Refresh Button */
        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            color: #64748b;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background-color: #f1f5f9;
            color: #3b82f6;
        }

        .btn-icon svg {
            width: 20px;
            height: 20px;
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- New Dashboard Status Bar -->
        <div id="status-bar" class="dashboard-bar">
            <div class="status-group">
                <!-- Vector DB Pill -->
                <div class="status-pill" id="vector-status">
                    <!-- Database Icon -->
                    <svg class="pill-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
                    </svg>
                    <div class="pill-content">
                        <span class="pill-label">Vector DB</span>
                        <span class="pill-value">Checking...</span>
                    </div>
                    <span class="status-dot connecting"></span>
                </div>

                <!-- Graph DB Pill -->
                <div class="status-pill" id="graph-status">
                    <!-- Share/Network Icon -->
                    <svg class="pill-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                    </svg>
                    <div class="pill-content">
                        <span class="pill-label">Graph DB</span>
                        <span class="pill-value">Checking...</span>
                    </div>
                    <span class="status-dot connecting"></span>
                </div>
            </div>

            <!-- Refresh Button -->
            <button id="refresh-status-btn" class="btn-icon" title="Refresh Status">
                <svg class="refresh-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
        <h1>Memory Review Queue</h1>
        <div id="queue-container">
            <div class="loading">Loading queue...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
